[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melon"
version = "0.1.0"
description = "Sandboxed prototype of the Melon package manager"
requires-python = ">=3.11"

[project.scripts]
melon = "melon.cli:main"
melon-grow = "melon.grow:main"
melon-build = "melon.build_cli:main"
melon-pack = "melon.pack:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
