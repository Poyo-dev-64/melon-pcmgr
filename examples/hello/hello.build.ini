[package]
name = hello
version = 1.0.0
desc = Example package built via melon-build
depends =

[source]
# url can be http(s):// or file:// to a tarball. Leave empty to build without sources.
url =
sha256 =
subdir =
patches =

[build]
prefix = /usr

# Commands run in the extracted source directory (or an empty build dir if no source).
# This example doesn't compile anything; it just stages a file into DESTDIR.
commands =

# Install commands should place final artifacts under $DESTDIR using the target filesystem layout.
# MELON_SPEC_DIR points at the directory containing this buildspec, so you can copy built artifacts.
install =
  powershell -Command "New-Item -ItemType Directory -Force \"$env:DESTDIR\\usr\\bin\" | Out-Null"
  powershell -Command "Copy-Item -Force \"$env:MELON_SPEC_DIR\\files\\usr\\bin\\hello.txt\" \"$env:DESTDIR\\usr\\bin\\hello.txt\""
